[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova"
version = "0.1.0"
description = "NOVA — Networked On-demand Virtual Acceleration. Heterogeneous P2P GPU batch runtime."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "NOVA" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "pillow>=10.4.0",
    "typer>=0.12.5",
    "websockets>=13.1",
]

[project.optional-dependencies]
gpu = [
    "diffusers>=0.31.0",
    "transformers>=4.45.0",
    "accelerate>=1.1.0",
    "safetensors>=0.4.5",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
nova = "nova.main:app"

[tool.setuptools.packages.find]
include = ["nova*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
